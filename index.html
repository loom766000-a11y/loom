<style>
:root{--cy:#07f5ff;--bl:#0b63ff;--ln:#0b3794;--pn:#00102c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:#fff;font-family:Tajawal,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#010d26}
body{display:flex;flex-direction:column;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));overflow:hidden;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 linear-gradient(118deg,transparent 0 6%,rgba(20,100,255,.35) 6% 6.5%,transparent 6.5% 9%,rgba(20,100,255,.18) 9% 12%,transparent 12%),
 linear-gradient(-62deg,transparent 0 88%,rgba(20,100,255,.35) 88% 88.5%,transparent 88.5% 91%,rgba(20,100,255,.18) 91% 94%,transparent 94%),
 radial-gradient(110% 50% at 50% 0%,#05306e66,transparent 70%),linear-gradient(#010a1f,#01102b)}
header{width:100%;max-width:600px;height:64px;display:flex;align-items:center;justify-content:center;border:2px solid #0a3fbf;border-radius:26px;background:linear-gradient(#03163b,#010f26);box-shadow:0 0 18px #0a4cff66,inset 0 0 18px #0a4cff33}
header img{height:42px;display:block;filter:drop-shadow(0 0 7px #1e7bff)}
.top{width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 4px}
#p{font-size:20px;font-weight:700;line-height:1.35}
#p::after{content:"";display:block;width:46px;height:3px;margin-top:6px;border-radius:3px;background:#07e5fb;box-shadow:0 0 8px #07e5fb}
#t{font-variant-numeric:tabular-nums;font-weight:700;padding:3px 14px;border-radius:99px;border:1.5px solid var(--ln);background:var(--pn);color:var(--cy)}
#t.low{background:#e53935;border-color:#ff7b78;color:#fff}
canvas{background:#fff;border-radius:16px;border:3px solid #0242dd;box-shadow:0 0 20px #0a5cff99;touch-action:none}
.row{width:100%;max-width:600px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.sw{flex:1 1 0;min-width:0;max-width:44px;aspect-ratio:1/1;padding:0;border-radius:50%;border:2px solid #ffffff55;box-shadow:0 0 8px #0a4cff55}
.sw.on{border-color:var(--cy);box-shadow:0 0 0 3px #010d26,0 0 0 5px var(--cy),0 0 14px var(--cy)}
.b{height:48px;min-width:0;padding:0 10px;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;border:1.5px solid var(--ln);background:var(--pn);color:#fff;font:inherit;font-weight:500;box-shadow:inset 0 0 12px #0a4cff22}
.b.on{border-color:var(--cy);box-shadow:0 0 12px #07f5ff88,inset 0 0 10px #07f5ff33}
.b.sz{flex:none;width:54px}
.b i{display:block;border-radius:50%;background:#fff}
.b svg{flex:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#send{width:100%;max-width:600px;height:54px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:30px;border:2px solid #0a3fbf;font:inherit;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(#1ba2ff,#006dfc);box-shadow:0 0 20px #0a7cff99}
#send svg{flex:none;width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#send:disabled{opacity:.6}
#m{min-height:18px;font-size:14px;color:#ff7b78}
</style>

<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const q=new URLSearchParams(location.search);
document.getElementById('p').textContent=q.get('p')||'ارسم بحرية';
let left=parseInt(q.get('t'))||0;
// اللوح: 254 وحدة عرضاً و178 ارتفاعاً (نسبة 10:7). لون 7 = أبيض. عرض 3 = الممسح.
const COLORS=['#1b1b1f','#e53935','#1e88e5','#43a047','#fdd835','#fb8c00','#8d5a3b','#ffffff'];
const WIDTHS=[3,7,14,26];
let strokes=[],cur=null,color=0,wid=1,eraser=false,sent=false,W=300,H=210;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
function msg(t){$('m').textContent=t;}

// ENC-START
function rdp(p,t){if(p.length<3)return p;const keep=new Uint8Array(p.length);keep[0]=keep[p.length-1]=1;const st=[[0,p.length-1]];
 while(st.length){const[a,b]=st.pop();let md=0,mi=-1;const ax=p[a][0],ay=p[a][1],dx=p[b][0]-ax,dy=p[b][1]-ay,L=Math.hypot(dx,dy);
  for(let i=a+1;i<b;i++){const d=L?Math.abs(dy*(p[i][0]-ax)-dx*(p[i][1]-ay))/L:Math.hypot(p[i][0]-ax,p[i][1]-ay);if(d>md){md=d;mi=i;}}
  if(md>t&&mi>0){keep[mi]=1;st.push([a,mi],[mi,b]);}}
 return p.filter((_,i)=>keep[i]);}
function encode(list){for(let t=0.5;t<=6;t+=0.5){const b=[];
  for(const s of list){b.push(255,s.c*4+s.w);for(const q of rdp(s.p,t))b.push(q[0],q[1]);}
  const out=btoa(String.fromCharCode.apply(null,b));if(out.length<=3900)return out;}
 return '';}
// ENC-END

function fit(){W=Math.max(240,Math.min(innerWidth-28,(innerHeight-340)/0.7,600));H=Math.round(W*0.7);const d=window.devicePixelRatio||1;
 cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);redraw();}
function pt(e){const r=cv.getBoundingClientRect(),k=254/r.width;
 return[Math.max(0,Math.min(254,Math.round((e.clientX-r.left)*k))),Math.max(0,Math.min(178,Math.round((e.clientY-r.top)*k)))];}
function drawStroke(s){const k=W/254,p=s.p;if(!p.length)return;ctx.strokeStyle=ctx.fillStyle=COLORS[s.c];ctx.lineWidth=WIDTHS[s.w]*k;ctx.lineCap=ctx.lineJoin='round';
 if(p.length<2){ctx.beginPath();ctx.arc(p[0][0]*k,p[0][1]*k,ctx.lineWidth/2,0,7);ctx.fill();return;}
 ctx.beginPath();ctx.moveTo(p[0][0]*k,p[0][1]*k);
 for(let i=1;i<p.length-1;i++)ctx.quadraticCurveTo(p[i][0]*k,p[i][1]*k,(p[i][0]+p[i+1][0])/2*k,(p[i][1]+p[i+1][1])/2*k);
 ctx.lineTo(p[p.length-1][0]*k,p[p.length-1][1]*k);ctx.stroke();}
function redraw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);strokes.forEach(drawStroke);if(cur)drawStroke(cur);}

cv.addEventListener('pointerdown',e=>{if(sent)return;e.preventDefault();cv.setPointerCapture(e.pointerId);cur={c:eraser?7:color,w:eraser?3:wid,p:[pt(e)]};msg('');redraw();});
cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();const p=pt(e),l=cur.p[cur.p.length-1];if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])>=1){cur.p.push(p);redraw();}});
const end=()=>{if(cur){strokes.push(cur);cur=null;redraw();}};
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,end));

function mark(box,i){[...box.children].forEach((x,j)=>x.classList.toggle('on',j===i));}
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i===0?' on':'');b.style.background=c;
 b.onclick=()=>{color=i;eraser=false;$('era').classList.remove('on');mark($('cols'),i);};$('cols').appendChild(b);});
[8,16,24].forEach((d,i)=>{const b=document.createElement('button');b.className='b sz'+(i===wid?' on':'');b.innerHTML='<i style="width:'+d+'px;height:'+d+'px"></i>';
 b.onclick=()=>{wid=i;eraser=false;$('era').classList.remove('on');mark($('sizes'),i);};$('sizes').appendChild(b);});
$('era').onclick=()=>{eraser=!eraser;$('era').classList.toggle('on',eraser);if(eraser)[...$('sizes').children].forEach(x=>x.classList.remove('on'));else mark($('sizes'),wid);};
$('undo').onclick=()=>{if(!sent){strokes.pop();redraw();}};

function send(auto){
 if(sent)return;
 let d;
 if(!strokes.length){if(!auto){msg('ارسم شي أولاً');return;}d='/wA=';}
 else{d=encode(strokes);if(!d){msg('الرسمة معقدة، امسح جزء منها وأرسل');return;}}
 sent=true;$('send').disabled=true;
 if(tg)tg.sendData(d);else msg('تم (خارج تيليجرام): '+d.length+' حرف');
}
$('send').onclick=()=>send(false);

if(left>0){const t=$('t');t.hidden=false;
 const tick=()=>{t.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');t.classList.toggle('low',left<=10);
  if(left<=0){send(true);return;}left--;setTimeout(tick,1000);};tick();}
addEventListener('resize',fit);fit();
</script>
