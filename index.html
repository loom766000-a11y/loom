<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RAY - لوح الرسم</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #050b1f; --bg2: #08122e; --blue: #1e6bff; --cyan: #29b6ff;
    --panel: #0a1840; --line: #12348f;
  }
  /* منع السحب/التمرير/الإغلاق بالسحب من فوق لتحت */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none;
    position: fixed; inset: 0;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    background: var(--bg); color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  }
  body {
    background:
      radial-gradient(120% 60% at 50% 0%, #0b1f5c 0%, transparent 60%),
      radial-gradient(100% 50% at 50% 100%, #0a1a52 0%, transparent 60%),
      linear-gradient(180deg, var(--bg2), var(--bg));
  }
  /* خطوط نيون مائلة بالزوايا */
  .deco { position: absolute; pointer-events: none; z-index: 0; width: 38%;
          -webkit-mask-image: linear-gradient(180deg,#000 40%,transparent); mask-image: linear-gradient(180deg,#000 40%,transparent); }
  .deco.br, .deco.bl { -webkit-mask-image: linear-gradient(0deg,#000 40%,transparent); mask-image: linear-gradient(0deg,#000 40%,transparent); }
  .deco.tr, .deco.tl { top: 0; height: 90px; }
  .deco.br, .deco.bl { bottom: 0; height: 110px; }
  .deco.tr, .deco.bl { right: auto; }
  .deco.tr { right: 0;
    background: linear-gradient(115deg, transparent 55%, rgba(30,107,255,.55) 56%, transparent 59%, transparent 66%, rgba(30,107,255,.3) 67%, transparent 72%); }
  .deco.tl { left: 0;
    background: linear-gradient(65deg, transparent 55%, rgba(30,107,255,.55) 56%, transparent 59%, transparent 66%, rgba(30,107,255,.3) 67%, transparent 72%); }
  .deco.br { right: 0;
    background: linear-gradient(65deg, transparent 55%, rgba(30,107,255,.55) 56%, transparent 59%, transparent 66%, rgba(30,107,255,.3) 67%, transparent 72%); }
  .deco.bl { left: 0;
    background: linear-gradient(115deg, transparent 55%, rgba(30,107,255,.55) 56%, transparent 59%, transparent 66%, rgba(30,107,255,.3) 67%, transparent 72%); }
  .mark { position: absolute; z-index: 0; pointer-events: none; font-weight: 900; font-style: italic;
          color: #1647c9; opacity: .55; line-height: 1; letter-spacing: -2px; text-shadow: 0 0 12px rgba(30,107,255,.6); }
  .mark.t { top: 6px; right: 12px; font-size: 38px; }
  .mark.b { bottom: 8px; left: 14px; font-size: 56px; }

  #app { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
         padding: calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px);
         box-sizing: border-box; gap: 10px; }

  /* الشريط العلوي: شارة RAY + السؤال + العدّاد */
  #top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding: 0 6px; }
  #brand { font-weight: 900; font-size: 22px; letter-spacing: 1px; position: relative; padding-bottom: 6px;
           text-shadow: 0 0 10px rgba(41,182,255,.7); }
  #brand::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: 0; height: 3px; border-radius: 3px;
                  background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  #prompt { flex: 1; text-align: center; font-size: 16px; font-weight: 700; line-height: 1.3; padding-bottom: 6px;
            text-shadow: 0 0 10px rgba(41,182,255,.5); }
  #timer { font-size: 18px; font-weight: 800; min-width: 50px; text-align: center; margin-bottom: 4px;
           background: var(--panel); border: 1.5px solid var(--blue); border-radius: 12px; padding: 4px 8px;
           box-shadow: 0 0 10px rgba(30,107,255,.5); }
  #timer.low { background: #5c0f16; border-color: #ff4d5a; box-shadow: 0 0 12px rgba(255,77,90,.6); }

  #boardWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #frame { border: 2.5px solid var(--blue); border-radius: 18px; padding: 0; background: #fff; overflow: hidden;
           box-shadow: 0 0 0 1px #0b2c8a, 0 0 18px rgba(30,107,255,.75), 0 0 40px rgba(30,107,255,.35); }
  #board { display: block; touch-action: none; }
  #frame { position: relative; }
  #mini { position: absolute; left: 6px; bottom: 6px; width: 46px; height: 32px; background: rgba(0,0,0,.35);
          border: 1px solid rgba(255,255,255,.65); border-radius: 5px; pointer-events: none; }
  #mini[hidden] { display: none; }
  #miniV { position: absolute; border: 1.5px solid #29b6ff; background: rgba(41,182,255,.25); box-sizing: border-box; }
  /* أزرار الزوم عائمة فوق اللوحة (زاوية يمين فوق) لتكون بمتناول الإصبع أثناء الرسم */
  #zoomRow { position: absolute; top: 6px; right: 6px; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 6px; direction: ltr; }
  #zoomRow button { width: 40px; height: 40px; min-width: 0; padding: 0; border-radius: 12px; background: rgba(10,24,64,.82); border: 1.5px solid var(--blue);
                    color: #fff; font: inherit; font-size: 22px; font-weight: 700; line-height: 1; touch-action: manipulation;
                    display: flex; align-items: center; justify-content: center;
                    box-shadow: 0 2px 8px rgba(0,0,0,.35); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  #zoomRow button svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #zoomRow #zLbl { height: 26px; font-size: 13px; border-radius: 9px; }
  #zoomRow button.on { border-color: var(--cyan); background: rgba(30,107,255,.9); box-shadow: 0 0 10px rgba(41,182,255,.8); }
  #zoomRow button:disabled { opacity: .35; }
  #cap { height: 5px; margin: -4px 8px 0; border-radius: 5px; background: rgba(255,255,255,.12); overflow: hidden; flex: none; }
  #capFill { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--cyan); transition: width .15s, background .15s; }
  #cap.hot #capFill { background: #ff9800; }
  #cap.full #capFill { background: #e53935; }

  .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  #colors { padding: 0 4px; }
  .sw { width: 38px; height: 38px; border-radius: 50%; box-sizing: border-box;
        border: 2px solid rgba(255,255,255,.18); box-shadow: 0 0 6px rgba(0,0,0,.5); }
  .sw.on { border: 3px solid var(--cyan); box-shadow: 0 0 0 2px #fff3, 0 0 12px var(--cyan); transform: scale(1.12); }

  .tool { height: 46px; border-radius: 12px; background: var(--panel); border: 1.5px solid var(--line);
          display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; font: inherit;
          font-size: 14px; padding: 0 14px; touch-action: manipulation; box-shadow: inset 0 0 10px rgba(30,107,255,.15); }
  .tool svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tool.on { border-color: var(--cyan); box-shadow: 0 0 12px rgba(41,182,255,.7), inset 0 0 10px rgba(41,182,255,.25); }
  .wd { width: 32px; padding: 0; flex: none; }
  .wd i { display: block; background: #fff; border-radius: 50%; }
  #eraser, #undo, #shapesBtn, #bgBtn, #rotBtn { flex: 1; min-width: 0; flex-direction: column; gap: 2px; font-size: 10.5px; padding: 0 2px; white-space: nowrap; }
  #tools { gap: 5px; }
  #widths { gap: 4px !important; }
  .tool:disabled { opacity: .35; }
  #eraser svg, #undo svg, #shapesBtn svg, #bgBtn svg, #rotBtn svg { width: 20px; height: 20px; }
  #shapesBtn.on svg { stroke: var(--cyan); }
  #shBack { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,.28); }
  #sheet { position: absolute; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 8px); height: min(60%, 440px);
           z-index: 21; background: #20232e; border: 1px solid rgba(255,255,255,.08); border-radius: 26px;
           display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.65); overflow: hidden; }
  #sheet[hidden], #shBack[hidden] { display: none; }
  #shHead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.08); flex: none; }
  #shTitle { flex: 1; font-size: 20px; font-weight: 800; }
  #shFree { height: 40px; padding: 0 14px; border-radius: 14px; border: 0; background: #2d313d; color: #fff; font: inherit; font-size: 14px; }
  #shFree.on { background: #1e6bff; }
  #shClose { width: 42px; height: 40px; border-radius: 14px; border: 0; background: #2d313d; color: #fff; font-size: 22px; line-height: 1; }
  #shGrid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: grid;
            grid-template-columns: repeat(3, 1fr); grid-auto-rows: 62px; gap: 10px; padding: 14px 16px 18px; }
  .shc { border: 0; border-radius: 16px; background: #2a2d39; display: flex; align-items: center; justify-content: center; touch-action: manipulation; padding: 0; }
  .shc svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .shc.on { background: #1e6bff; }
  #tools { direction: ltr; }
  #tools .tool { direction: rtl; }

  #send { height: 52px; border: 0; border-radius: 26px; font: inherit; font-size: 18px; font-weight: 800; color: #fff;
          display: flex; align-items: center; justify-content: center; gap: 10px; touch-action: manipulation;
          background: linear-gradient(180deg, #2da1ff, #0a6cff);
          box-shadow: 0 0 0 2px #0a2f8f, 0 0 18px rgba(30,107,255,.8); }
  #send svg { width: 26px; height: 26px; fill: #fff; }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
<div class="deco tr"></div><div class="deco tl"></div><div class="deco br"></div><div class="deco bl"></div>
<div class="mark b">R</div>

<div id="app">
  <div id="top">
    <div id="brand">RAY</div>
    <div id="prompt"></div>
    <div id="timer">--</div>
  </div>

  <div id="boardWrap"><div id="frame"><canvas id="board"></canvas><div id="mini" hidden><i id="miniV"></i></div>
    <div id="zoomRow">
      <button id="zIn" type="button" aria-label="تكبير">+</button>
      <button id="zLbl" type="button" aria-label="إعادة الحجم">×1</button>
      <button id="zOut" type="button" aria-label="تصغير" disabled>−</button>
      <button id="zPan" type="button" aria-label="تحريك اللوحة" disabled><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
    </div>
  </div></div>
  <div id="cap"><i id="capFill"></i></div>

  <div class="row" id="colors"></div>
  <div class="row" id="tools">
    <button class="tool" id="shapesBtn" type="button">
      <svg viewBox="0 0 24 24"><circle cx="16" cy="8" r="4.5"/><path d="M3 20l5.5-9.5L14 20z"/></svg>
      <span id="shapesLbl">أشكال</span>
    </button>
    <button class="tool" id="rotBtn" type="button" disabled>
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      تدوير
    </button>
    <button class="tool" id="bgBtn" type="button">
      <svg viewBox="0 0 24 24"><path d="M5 11l6-6 7 7-6 6z"/><path d="M19.5 15c.9 1.4 1.8 2.4 1.8 3.3a1.8 1.8 0 0 1-3.6 0c0-.9.9-1.9 1.8-3.3z"/></svg>
      خلفية
    </button>
    <button class="tool" id="eraser" type="button">
      <svg viewBox="0 0 24 24"><path d="M3 15l9-9a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-6 6H8l-5-5z"/><path d="M9 9l6 6"/></svg>
      ممسح
    </button>
    <button class="tool" id="undo" type="button">
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      تراجع
    </button>
    <span class="row" id="widths" style="gap:8px"></span>
  </div>
  <div id="shBack" hidden></div>
  <div id="sheet" hidden>
    <div id="shHead">
      <span id="shTitle">الأشكال</span>
      <button id="shFree" type="button">✏️ رسم حر</button>
      <button id="shClose" type="button">✕</button>
    </div>
    <div id="shGrid"></div>
  </div>
  <button id="send" type="button">
    <svg viewBox="0 0 24 24"><path d="M21.5 3L2 11l6 2.2L10 20l3-4 5 3.5z"/></svg>
    إرسال الرسمة
  </button>
</div>

<script>
(function () {
  // ===== نفس ثوابت البوت =====
  var COLORS = ['#1b1b1f', '#e53935', '#1e88e5', '#43a047', '#fdd835', '#fb8c00', '#8d5a3b', '#ffffff'];
  var WIDTHS = [3, 7, 14, 26];
  var UI_WIDTHS = [0, 1, 2, 3];     // السماكات الظاهرة بالواجهة (فهارس WIDTHS)
  var W = 254, H = 178;
  var MAX_RAW = 3000;            // sendData حده 4096 حرف (base64) ≈ 3072 بايت خام

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    // يمنع إغلاق الصفحة بالسحب لتحت وتحرك الصفحة وقت الرسم
    try { tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.enableClosingConfirmation(); } catch (e) {}
    try { tg.setHeaderColor('#050b1f'); tg.setBackgroundColor('#050b1f'); } catch (e) {}
  }

  // منع أي تمرير/سحب على مستوى الصفحة
  ['touchmove', 'gesturestart', 'gesturechange', 'wheel', 'contextmenu'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (e.target && e.target.closest && e.target.closest('#shGrid')) return;
      e.preventDefault();
    }, { passive: false });
  });

  var q = new URLSearchParams(location.search);
  document.getElementById('prompt').textContent = q.get('p') || 'ارسم أي شي من خيالك';
  var total = parseInt(q.get('t'), 10) || 75;

  // ===== مكتبة الأشكال: كل شكل = خطوط بإحداثيات (0..1) تتمدد داخل المستطيل اللي يسحبه اللاعب =====
  var PI = Math.PI;
  function ell(cx, cy, rx, ry, a0, a1, n) {
    var o = [];
    for (var i = 0; i <= n; i++) { var a = (a0 + (a1 - a0) * i / n) * PI / 180; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
    return o;
  }
  function quad(p0, c, p1, n) {
    var o = [];
    for (var i = 0; i <= n; i++) { var t = i / n, u = 1 - t;
      o.push([u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0], u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1]]); }
    return o;
  }
  function closed(a) { a.push(a[0].slice()); return a; }
  function regular(n, rot) { var o = []; for (var i = 0; i < n; i++) { var a = (rot + 360 * i / n) * PI / 180; o.push([.5 + .5 * Math.cos(a), .5 + .5 * Math.sin(a)]); } return closed(o); }
  function ray(o, d, c) { // مسافة خروج الشعاع من دائرة
    var ox = o[0] - c[0], oy = o[1] - c[1], b = d[0] * ox + d[1] * oy, q = ox * ox + oy * oy - c[2] * c[2], disc = b * b - q;
    return disc < 0 ? -1 : -b + Math.sqrt(disc);
  }
  function cloud() {
    var cs = [[.27, .64, .2], [.5, .42, .27], [.75, .62, .22]], o = [.5, .6], pts = [];
    for (var i = 0; i <= 64; i++) {
      var a = (150 + 240 * i / 64) * PI / 180, d = [Math.cos(a), Math.sin(a)], t = 0;
      cs.forEach(function (c) { var r = ray(o, d, c); if (r > t) t = r; });
      pts.push([o[0] + d[0] * t, Math.min(o[1] + d[1] * t, .84)]);
    }
    return [closed(pts)];
  }
  function heart() {
    var o = [];
    for (var i = 0; i <= 48; i++) { var t = 2 * PI * i / 48;
      o.push([16 * Math.pow(Math.sin(t), 3), -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]); }
    return [o];
  }
  function starPts(n, ro, ri) { var o = []; for (var i = 0; i < 2 * n; i++) { var a = (-90 + 180 * i / n) * PI / 180, r = i % 2 ? ri : ro; o.push([.5 + r * Math.cos(a), .5 + r * Math.sin(a)]); } return closed(o); }
  function bubble() {
    var o = [[.12, 0], [.88, 0]];
    o = o.concat(ell(.88, .12, .12, .12, -90, 0, 6), [[1, .66]], ell(.88, .66, .12, .12, 0, 90, 6), [[.5, .78], [.3, 1], [.3, .78], [.12, .78]],
      ell(.12, .66, .12, .12, 90, 180, 6), [[0, .12]], ell(.12, .12, .12, .12, 180, 270, 6));
    return [closed(o)];
  }
  function dropShape() {
    var o = [];
    for (var i = 0; i <= 44; i++) { var t = 2 * PI * i / 44; o.push([Math.sin(t) * Math.pow(Math.sin(t / 2), 1.3), -Math.cos(t)]); }
    return [o];
  }
  function pinShape() {
    var a = Math.acos(.38 / .62) * 180 / PI;
    var outer = [[.5, 1]].concat(ell(.5, .38, .38, .38, 90 - a, 90 - a - (360 - 2 * a), 40));
    return [closed(outer), ell(.5, .38, .14, .14, 0, 360, 16)];
  }
  function crescent() {
    var d = .2, r1 = .5, r2 = .42, a = (d * d + r1 * r1 - r2 * r2) / (2 * d), h = Math.sqrt(r1 * r1 - a * a);
    var a1 = Math.atan2(-h, a) * 180 / PI, a2 = Math.atan2(h, a - d) * 180 / PI;
    var outer = ell(.5, .5, r1, r1, a1, a1 - (360 - 2 * Math.abs(a1)), 30);
    var inner = ell(.5 + d, .5, r2, r2, a2, 360 - a2, 22);
    return [closed(outer.concat(inner))];
  }
  function infinity() { var o = []; for (var i = 0; i <= 56; i++) { var t = 2 * PI * i / 56, s = 1 + Math.sin(t) * Math.sin(t); o.push([Math.cos(t) / s, Math.sin(t) * Math.cos(t) / s]); } return [o]; }
  function wave() { var o = []; for (var i = 0; i <= 40; i++) { var u = i / 40; o.push([u, .5 - .5 * Math.sin(u * 4 * PI)]); } return [o]; }
  function leaf() { return [closed(quad([0, 1], [0, 0], [1, 0], 14).concat(quad([1, 0], [1, 1], [0, 1], 14).slice(1))), [[0, 1], [.62, .38]]]; }
  function shield() {
    return [closed([[.5, 0], [1, .17], [1, .5]].concat(quad([1, .5], [1, .82], [.5, 1], 8).slice(1), quad([.5, 1], [0, .82], [0, .5], 8).slice(1), [[0, .17]]))];
  }
  function semi() { return [closed(ell(.5, 1, .5, 1, 180, 360, 24))]; }
  function arrowHead(x, y, ang, hl) {
    var s = 28 * PI / 180;
    return [[x - hl * Math.cos(ang - s), y - hl * Math.sin(ang - s)], [x - hl * Math.cos(ang + s), y - hl * Math.sin(ang + s)]];
  }
  // sq = يحافظ على النسبة 1:1 ، seg = خط بين نقطتين (البداية والنهاية) ، ar = نسبة ارتفاع/عرض للأيقونة
  var SHAPES = [
    { id: 'circle', sq: 1, g: function () { return [ell(.5, .5, .5, .5, 0, 360, 44)]; } },
    { id: 'square', sq: 1, g: function () { return [closed([[0, 0], [1, 0], [1, 1], [0, 1]])]; } },
    { id: 'line', seg: 1, g: function (x0, y0, x1, y1) { return [[[x0, y0], [x1, y1]]]; } },
    { id: 'diamond', g: function () { return [closed([[.5, 0], [1, .5], [.5, 1], [0, .5]])]; } },
    { id: 'arrow', seg: 1, g: function (x0, y0, x1, y1) {
        var an = Math.atan2(y1 - y0, x1 - x0), hl = Math.min(16, Math.hypot(x1 - x0, y1 - y0) * .45), h = arrowHead(x1, y1, an, hl);
        return [[[x0, y0], [x1, y1], h[0], [x1, y1], h[1]]]; } },
    { id: 'triangle', g: function () { return [closed([[.5, 0], [1, 1], [0, 1]])]; } },
    { id: 'cloud', ar: .75, g: cloud },
    { id: 'heart', g: heart },
    { id: 'star', g: function () { return [starPts(5, .5, .21)]; } },
    { id: 'check', g: function () { return [[[0, .55], [.36, .92], [1, .1]]]; } },
    { id: 'bolt', g: function () { return [closed([[.62, 0], [.12, .58], [.46, .58], [.36, 1], [.88, .38], [.54, .38]])]; } },

    setZoomAbout(nz, vx + W / vz / 2, vy + H / vz / 2, .5, .5);
    if (vz <= 1.001) panMode = false;
    updateZoomUI();
  }
  document.getElementById('zIn').onclick = function () { zoomStep(1); };
  document.getElementById('zOut').onclick = function () { zoomStep(-1); };
  document.getElementById('zLbl').onclick = function () { vz = 1; vx = 0; vy = 0; panMode = false; redraw(); };
  document.getElementById('zPan').onclick = function () { panMode = !panMode; updateZoomUI(); };
  document.getElementById('rotBtn').onclick = function () { shapeRot = (shapeRot + 1) & 3; sync(); };
  document.getElementById('bgBtn').onclick = function () {
    if (sent || curBg === COLORS[color]) return;
    if (!ensureRoom(2)) { warnFull(); return; }
    strokes.push({ bg: 1, c: color, w: 0, p: [] });
    redraw(); updateCap();
  };
  document.getElementById('shClose').onclick = closeSheet;
  shBack.onclick = closeSheet;
  document.getElementById('shFree').onclick = function () { shapeId = null; closeSheet(); sync(); };
  sync();
  document.getElementById('undo').onclick = function () {
    if (sent) return;
    var last = strokes.pop();
    if (last && last.g) while (strokes.length && strokes[strokes.length - 1].g === last.g) strokes.pop();
    redraw(); updateCap();
  };

  // ===== الإرسال =====
  function encode() {
    var bytes = [];
    var bgC = -1; strokes.forEach(function (s) { if (s.bg) bgC = s.c; });
    if (bgC >= 0) bytes.push(255, 64 + bgC);
    strokes.forEach(function (s) { if (!s.bg && s.p.length) strokeBytes(s, bytes); });
    var bin = ''; bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return '2.' + btoa(bin);
  }
  var sendBtn = document.getElementById('send');
  function send() {
    if (sent) return; sent = true; sendBtn.disabled = true;
    var data = encode();
    try { if (tg) tg.disableClosingConfirmation(); } catch (e) {}
    if (tg && tg.sendData) tg.sendData(data); else alert('افتح الصفحة من تيليجرام');
  }
  sendBtn.onclick = send;

  // ===== العدّاد =====
  // وقت الانتهاء مطلق من البوت (e = epoch بالثواني)، يبدأ من لحظة إرسال الجولة للجميع
  var tEl = document.getElementById('timer');
  var endParam = parseInt(q.get('e'), 10);
  var skew = 0; // فرق ساعة الجوال عن ساعة السيرفر (ms)
  var endAt = endParam ? endParam * 1000 : Date.now() + total * 1000;
  var iv = null;
  function tick() {
    var left = Math.max(0, Math.ceil((endAt - (Date.now() + skew)) / 1000));
    tEl.textContent = left;
    if (left <= 10) tEl.classList.add('low');
    if (left <= 0) { clearInterval(iv); send(); }
  }
  function startTimer() { tick(); iv = setInterval(tick, 500); }
  document.addEventListener('visibilitychange', tick);
  if (endParam) {
    // نصحح فرق الساعة من ترويسة Date للاستضافة، وإذا فشل نكمل بدونه
    var done = false, t0 = Date.now();
    var go = function () { if (!done) { done = true; startTimer(); } };
    setTimeout(go, 1500);
    try {
      fetch(location.pathname + '?_=' + t0, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        var d = r.headers.get('Date');
        if (d && !done) { var t1 = Date.now(); skew = new Date(d).getTime() - (t0 + t1) / 2; }
        go();
      }).catch(go);
    } catch (e) { go(); }
  } else { startTimer(); }

  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 150); });
  fit();
})();
</script>
